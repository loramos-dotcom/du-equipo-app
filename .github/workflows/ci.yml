name: Verificación
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:auth
      - run: npm run test:install
      - run: npm run build
      - name: Formulario de tareas con datos ficticios
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4361 > /tmp/du-ui.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4361 > /dev/null; then break; fi
            sleep 1
          done
          browser_failures=0
          for browser_check in tests/work-links-browser.mjs tests/task-form-options-browser.mjs tests/panel-tasks-browser.mjs tests/weekly-tasks-browser.mjs tests/current-meeting-browser.mjs tests/calendar-browser.mjs tests/portfolio-browser.mjs tests/task-followup-browser.mjs tests/required-projects-browser.mjs; do
            if ! DU_TEST_ORIGIN=http://127.0.0.1:4361 node --experimental-strip-types "$browser_check"; then
              browser_failures=1
            fi
          done
          exit "$browser_failures"
      - name: Capturas de Mi semana con datos ficticios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-tasks-review
          path: |
            test-results/weekly-*.png
            test-results/weekly-tasks.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Capturas de Proyectos con datos ficticios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: projects-review
          path: |
            test-results/proyectos-*.png
            test-results/portfolio-*.png
            test-results/portfolio-browser.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Capturas de Bloqueos y ayuda con datos ficticios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-followup-review
          path: |
            test-results/task-followup-*.png
            test-results/task-followup-browser.json
          if-no-files-found: ignore
          retention-days: 3
      - run: npm run test:worker
      - name: Capturas de proyecto obligatorio con datos ficticios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-projects-review
          path: |
            test-results/required-projects-*.png
            test-results/required-projects-browser.json
          if-no-files-found: ignore
          retention-days: 3
      - run: npm run validate
